name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.3.1
    with:
      run-govulncheck: true
      coverage-min: "85"
      coverpkg: github.com/otfabric/docsync/...
      codecov-name: docsync
      go-versions: '["1.26", "1.27"]'
    secrets: inherit

  # The per-package floor (COVER_PKG_MIN) and docsync on its own documents.
  gates:
    name: Per-package coverage and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make coverage-pkg-check
      - run: go run . check --format github .
